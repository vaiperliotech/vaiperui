packages:
  - apps/*
  - packages/*

injectWorkspacePackages: false

allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false

catalog:
  react: ^19.3.0
  react-dom: ^19.3.0
  next: ^16.3.8
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/node": ^26.6.4
  typescript: ^7.0.2
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  "@tailwindcss/postcss": ^4.3.3
  tailwind-merge: ^3.7.0
  clsx: ^2.1.1
  vite: ^8.3.2
  "@vitejs/plugin-react": ^6.1.1
  tsup: ^8.5.1
  vitest: ^5.0.3
  "@vitest/browser": ^5.0.3
  "@vitest/browser-playwright": ^5.0.3
  playwright: ^1.63.0
  turbo: ^2.11.7
  storybook: ^10.6.1
  "@storybook/react-vite": ^10.6.1
  "@storybook/addon-vitest": ^10.6.1
  "@storybook/addon-a11y": ^10.6.1
  "@storybook/addon-docs": ^10.6.1
  "@testing-library/react": ^16.3.3
  "@testing-library/jest-dom": ^7.0.1
  jsdom: ^30.1.1
  "@biomejs/biome": ^2.5.15
  "@vaiperui/config": workspace:*
  vaiperui: workspace:*

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.7"
  - "@turbo/darwin-arm64@2.11.7"
  - "@turbo/linux-64@2.11.7"
  - "@turbo/linux-arm64@2.11.7"
  - "@turbo/windows-64@2.11.7"
  - "@turbo/windows-arm64@2.11.7"
  - "@types/node@26.6.4"
  - turbo@2.11.7
